<svg
    width="1600"
    height="900"
    viewBox="0 0 1600 900"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <radialGradient
            id="main"
            cx="0"
            cy="0"
            r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(800 450) rotate(90) scale(450 700)"
        >
            <stop
                stop-color="#A855F7"
                stop-opacity="0.20"
            />

            <stop
                offset="0.45"
                stop-color="#10B981"
                stop-opacity="0.06"
            />

            <stop
                offset="1"
                stop-color="#050505"
                stop-opacity="0"
            />
        </radialGradient>

        <filter
            id="blur"
            x="-100"
            y="-100"
            width="1800"
            height="1100"
            filterUnits="userSpaceOnUse"
        >
            <feGaussianBlur
                stdDeviation="70"
            />
        </filter>
    </defs>

    <ellipse
        cx="800"
        cy="450"
        rx="600"
        ry="300"
        fill="url(#main)"
        filter="url(#blur)"
    />

    <ellipse
        cx="800"
        cy="450"
        rx="520"
        ry="220"
        stroke="#A855F7"
        stroke-opacity="0.08"
    />

    <ellipse
        cx="800"
        cy="450"
        rx="380"
        ry="150"
        stroke="#10B981"
        stroke-opacity="0.06"
    />
</svg>