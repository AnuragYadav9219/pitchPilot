spring:
  jackson:
    time-zone: Asia/Kolkata

  application:
    name: virtualmento

  datasource:
    url: jdbc:postgresql://localhost:5432/pitchpilot
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

server:
  port: 8080
